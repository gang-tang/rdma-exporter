# Global agent configuration
[agent]
  interval = "5s"
  round_interval = false
  metric_batch_size = 10000
  metric_buffer_limit = 50000
  collection_jitter = "1s"
  flush_interval = "5s"
  flush_jitter = "1s"
  precision = ""
  debug = true
  quiet = false
  logfile = ""

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

[[inputs.tail]]
  ## Files to parse each interval. Accept standard globs.
  files = ["/dev/shm/munic*.influx"]
  
  ## File format
  ## Supported formats: influx, graphite, csv, json, grok, xml, logfmt, value
  data_format = "influx"
  max_undelivered_lines = 10000 

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

[[outputs.influxdb_v2]]
  urls = ["http://192.168.16.72:8181"]
  organization = ""
  token = "apiv3_VrcEDEKpplCq6C6Z5btOkSnaKUyHGCouT_EHrYCxKIFkFJr-YiqMawdGmppC02pspM1RWVa3LjHp4EBb8qugAg"
  bucket = "metrics"
  timeout = "20s"
